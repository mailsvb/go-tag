name: Test

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # For the recorder's encoder test (skipped without ffmpeg).
      - name: Install ffmpeg
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ffmpeg

      - name: Check formatting
        if: runner.os == 'macOS'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # The app and the libraries are separate modules; ./... stops at
      # nested go.mod files, so each module is checked on its own.
      - name: Vet
        shell: bash
        run: |
          for m in . mp3tags mp3gain; do
            (cd "$m" && go vet ./...) || exit 1
          done

      - name: Test
        shell: bash
        run: |
          for m in . mp3tags mp3gain; do
            (cd "$m" && go test -race ./...) || exit 1
          done
