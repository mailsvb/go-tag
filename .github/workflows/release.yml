name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (leave empty to bump the patch number of the latest release)"
        required: false
        type: string

permissions:
  contents: write

env:
  INITIAL_VERSION: 0.9.0

jobs:
  version:
    name: Determine version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          requested="${INPUT_VERSION#v}"
          if [ -n "$requested" ]; then
            if ! [[ "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version '$INPUT_VERSION' is not in X.Y.Z format"
              exit 1
            fi
            version="$requested"
          else
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              version="$INITIAL_VERSION"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "Releasing version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.name }})
    needs: [version, test]
    strategy:
      matrix:
        include:
          - name: windows_amd64
            os: windows-latest
            target: windows
          - name: macos_arm64
            os: macos-latest
            target: darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: fyne package --target ${{ matrix.target }} --release --app-version "$VERSION" --app-build ${{ github.run_number }}

      # The app bundle also carries the Now Playing adapter for recording; the
      # BlackHole driver submodule is not needed (the driver is installed separately).
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          git submodule update --init third_party/mediaremote-adapter
          make app VERSION="$VERSION" BUILD_NO=${{ github.run_number }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path go-tag.exe -DestinationPath "go-tag_${env:VERSION}_${{ matrix.name }}.zip"

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent go-tag.app "go-tag_${VERSION}_${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: go-tag_${{ matrix.name }}
          path: go-tag_*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
